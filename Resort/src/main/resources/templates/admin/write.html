<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Write</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .write-box{max-width:900px;margin:40px auto;padding:24px;background:white;border-radius:12px}
        .write-box textarea{width:100%;height:300px;padding:12px;border-radius:8px;border:1px solid #ddd}
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="write-box">
    <h2>Create Content</h2>
    <form method="post" action="#">
        <input type="text" name="title" placeholder="Title" style="width:100%;height:48px;padding:10px;margin-bottom:12px;border-radius:8px;border:1px solid #ddd">
        <textarea name="body" placeholder="Write here..."></textarea>
        <div style="margin-top:12px">
            <button class="dashboard-btn" type="submit">Save</button>
        </div>
    </form>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
