<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>AI Resort Assistant</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 30px 20px;
        }

        .ai-panel {
            margin: 0 auto;
            max-width: 960px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .ai-hero {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 28px;
            padding: 40px;
        }

        .ai-hero h1 {
            font-size: 42px;
            color: #111827;
            margin-bottom: 16px;
        }

        .ai-hero p {
            color: #4b5563;
            line-height: 1.8;
            max-width: 560px;
            margin-bottom: 24px;
        }

        .ai-hero img {
            width: 100%;
            border-radius: 24px;
            object-fit: cover;
            min-height: 280px;
        }

        .ai-form {
            padding: 0 40px 40px;
        }

        .chat-box {
            background: #f8fafc;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
        }

        .chat-message {
            margin-bottom: 18px;
            display: grid;
            gap: 8px;
        }

        .chat-message.user p {
            background: #e0f2fe;
            color: #0f172a;
            padding: 16px;
            border-radius: 20px;
            max-width: 85%;
        }

        .chat-message.bot p {
            background: #f1f5f9;
            color: #0f172a;
            padding: 16px;
            border-radius: 20px;
            max-width: 85%;
        }

        .ai-form textarea {
            width: 100%;
            min-height: 140px;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #d1d5db;
            font-size: 16px;
            resize: vertical;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .ai-form button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .top-nav {
            padding: 22px 40px;
            background: #111827;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-nav a {
            text-decoration: none;
            color: white;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 12px;
        }

        .message-sender {
            font-size: 0.9rem;
            color: #475569;
        }
    </style>

</head>

<body>

<div class="ai-panel">
    <div class="top-nav">
        <div><strong>Pariwar AI</strong></div>
        <a href="/dashboard">Dashboard</a>
    </div>
    <div class="ai-hero">
        <div>
            <h1>Ask the resort concierge anything.</h1>
            <p>Use AI to get quick recommendations for rooms, dining, check-in, billing, and resort services.</p>
        </div>
        <img src="https://images.unsplash.com/photo-1542281286-9e0a16bb7366?q=80&w=1200&auto=format&fit=crop" alt="AI resort assistant">
    </div>
    <div class="ai-form">
        <div class="chat-box" th:if="${messages}">
            <div class="chat-message" th:each="msg : ${messages}" th:classappend="${msg.sender == 'User'} ? ' user' : ' bot'">
                <div class="message-sender" th:text="${msg.sender}"></div>
                <p th:text="${msg.message}"></p>
            </div>
        </div>
        <form action="/ask-ai" method="post">
            <textarea name="prompt" placeholder="Type your resort question here..." required></textarea>
            <button type="submit">Send</button>
        </form>
    </div>
</div>

</body>

</html>
