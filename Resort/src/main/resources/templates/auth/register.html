<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="auth-body">

<div class="auth-wrapper">

    <div class="auth-left">
        <div class="overlay"></div>

        <div class="auth-content">
            <h1>Pariwar</h1>

            <p>
                Create your account and enjoy digital booking,
                smart check-in, restaurant services,
                and luxury room management.
            </p>
        </div>
    </div>

    <div class="auth-right">

        <form th:action="@{/register}"
              th:object="${user}"
              method="post"
              class="auth-form">

            <h2>Create Account</h2>

            <p class="sub-text">
                Register to continue. Accounts are created as customers by default; admin can assign waiter or admin roles later.
            </p>
            <input type="hidden" th:field="*{role}" value="ROLE_USER" />

            <div class="input-box">
                <i class="fa-solid fa-user"></i>

                <input type="text"
                       th:field="*{fullName}"
                       placeholder="Full Name"
                       required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>

                <input type="email"
                       th:field="*{email}"
                       placeholder="Email Address"
                       required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       th:field="*{password}"
                       placeholder="Password"
                       required>
            </div>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

            <p class="bottom-text">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
